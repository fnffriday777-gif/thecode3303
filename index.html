<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini ARG</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
      color: white;
      font-family: monospace;
      flex-direction: column;
    }
    .inputs {
      display: flex;
      gap: 10px;
    }
    input {
      width: 50px;
      height: 50px;
      font-size: 24px;
      text-align: center;
      background: #111;
      border: 2px solid white;
      color: white;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #msg {
      margin-top: 15px;
      color: red;
    }
  </style>
</head>
<body>

<h1>You shouldn’t be here</h1>

<div class="inputs">
  <input maxlength="1" id="c1">
  <input maxlength="1" id="c2">
  <input maxlength="1" id="c3">
  <input maxlength="1" id="c4">
</div>

<button onclick="checkCode()">Enter</button>
<p id="msg"></p>

<script>
  const secreto = ["4","7","2","9"]; // Cambia esto si quieres otro código

  function checkCode() {
    const valores = [
      document.getElementById("c1").value,
      document.getElementById("c2").value,
      document.getElementById("c3").value,
      document.getElementById("c4").value
    ];

    let correcto = true;
    for(let i=0; i<4; i++) {
      if(valores[i] !== secreto[i]) correcto = false;
    }

    if(correcto) {
      window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; // Cambia por tu vídeo
    } else {
      document.getElementById("msg").innerText = "Incorrecto… sigue buscando";
    }
  }

  // Opcional: mover foco automáticamente
  const inputs = document.querySelectorAll(".inputs input");
  inputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      if(input.value && idx < inputs.length-1) {
        inputs[idx+1].focus();
      }
    });
  });
</script>

</body>
</html>
